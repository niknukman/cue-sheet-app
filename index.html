<!doctype html>
<html lang="ms">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<script>window.CS_API = "https://script.google.com/macros/s/AKfycbzeDB5je7xASwU04c8nF7oQYLzj7O_AnXQOs0n3rs-uJBYy0mGUoL9jn5dTG0DSZ8lghQ/exec";</script>
<meta charset="utf-8">
<title>Cue Sheet Multimedia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: control-room run sheet. Sticky bar with event picker and view tabs; a dense cue matrix whose source columns read like switcher buttons; red tally = PGM, green = next. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#ECEFF3; --ink:#121820; --muted:#5A6573; --line:#DCE0E6; --line-strong:#BCC4CE;
  --accent:#0E6B50; --accent-ink:#FFFFFF; --accent-soft:#DCEFE7;
  --tally:#D7263D; --tally-ink:#FFFFFF; --tally-soft:#FBE4E7;
  --preview:#1E9A57; --preview-soft:#DFF3E7; --warn:#A86200; --warn-soft:#FBEFD9;
  --shadow:0 1px 2px rgba(18,24,32,.06),0 6px 20px rgba(18,24,32,.07);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1217; --surface:#151C23; --surface-2:#1B242D; --ink:#E6EBF0; --muted:#94A1AF; --line:#28323D; --line-strong:#3A4654;
    --accent:#40C196; --accent-ink:#05251A; --accent-soft:#12332A;
    --tally:#FF4B5C; --tally-ink:#FFFFFF; --tally-soft:#3A1920;
    --preview:#3BD186; --preview-soft:#123224; --warn:#F2A63B; --warn-soft:#3A2A12;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --surface-2:#1B242D; --ink:#E6EBF0; --muted:#94A1AF; --line:#28323D; --line-strong:#3A4654;
  --accent:#40C196; --accent-ink:#05251A; --accent-soft:#12332A;
  --tally:#FF4B5C; --tally-ink:#FFFFFF; --tally-soft:#3A1920;
  --preview:#3BD186; --preview-soft:#123224; --warn:#F2A63B; --warn-soft:#3A2A12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1680px;margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0}
.muted{color:var(--muted)}
svg{width:16px;height:16px;flex:none}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;padding-block:10px 4px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--ink);display:grid;place-items:center}
.brand-mark i{width:11px;height:11px;border-radius:50%;background:var(--tally);box-shadow:0 0 0 3px color-mix(in srgb,var(--tally) 35%,transparent)}
.brand-k{font:700 20px/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase}
.brand-s{font:500 10.5px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.event-pick{display:flex;gap:8px;align-items:center;flex:1 1 360px;min-width:0;justify-content:flex-end}
.event-pick select{flex:1 1 auto;min-width:0;max-width:440px;font-weight:500}
.status{font:500 11.5px/1 var(--f-mono);padding:7px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.status[data-tone="ok"]::before{background:var(--preview)}
.status[data-tone="busy"]::before{background:var(--warn)}
.status[data-tone="warn"]{color:var(--warn);background:var(--warn-soft)}
.status[data-tone="warn"]::before{background:var(--warn)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{font:600 15px/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;padding:11px 14px 12px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs a .dot{width:7px;height:7px;border-radius:50%;background:var(--tally)}

/* ---------- controls ---------- */
.btn{font:500 13px/1 var(--f-body);display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn.danger{color:var(--tally);border-color:color-mix(in srgb,var(--tally) 45%,var(--line))}
.btn.armed{background:var(--tally);color:var(--tally-ink);border-color:transparent}
.btn.big{padding:11px 18px;font-size:15px}
.btn.file{position:relative}
select,input[type="text"],input[type="date"],input[type="time"],input[type="number"],input[type="search"],input:not([type]),textarea{font:inherit;color:var(--ink)}
select,.inp{padding:7px 9px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ib{display:inline-grid;place-items:center;width:26px;height:24px;border-radius:5px;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib.del:hover,.ib.armed{color:var(--tally-ink);background:var(--tally)}
.ib svg{width:14px;height:14px}

.code{display:inline-block;font:600 11.5px/1 var(--f-mono);padding:5px 6px;border-radius:5px;background:var(--c,#64748b);color:var(--cfg,#fff);letter-spacing:.05em;min-width:42px;text-align:center}
.badge{display:inline-block;font:600 10px/1 var(--f-mono);letter-spacing:.08em;padding:4px 6px;border-radius:4px;vertical-align:middle}
.badge.on{background:var(--tally);color:var(--tally-ink)}
.badge.pvw{background:var(--preview);color:#fff}

.banner{display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:8px;background:var(--accent-soft);color:var(--ink);font-size:13px;margin-top:14px}
.banner.warn{background:var(--warn-soft)}

/* ---------- event head ---------- */
.ev-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 28px;padding-block:20px 10px;align-items:end}
.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ev-name{font:700 clamp(28px,3.6vw,44px)/1 var(--f-display);letter-spacing:.005em;text-wrap:balance;margin-top:6px}
.ev-theme{font:italic 400 15px/1.4 var(--f-body);color:var(--accent);margin-top:6px}
.ev-meta{display:flex;flex-wrap:wrap;gap:4px 20px;color:var(--muted);font-size:13px;margin-top:10px}
.ev-meta b{color:var(--ink);font-weight:500}
.stats{display:flex;gap:22px}
.stat .v{font:600 24px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat .l{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.legend{display:flex;flex-wrap:wrap;gap:8px;padding-block:6px 14px;align-items:stretch}
.legend .lg-t{font:600 13px/1 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:4px}
.lg{display:flex;align-items:center;gap:9px;padding:6px 11px 6px 6px;border-radius:8px;background:var(--surface);border:1px solid var(--line);min-width:0}
.lg-n{font-weight:500;font-size:13px;line-height:1.2}
.lg-d{font-size:11.5px;color:var(--muted);line-height:1.25}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding-block:4px 12px}
.tb-l,.tb-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{display:flex;align-items:center;gap:6px;padding:0 9px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--muted)}
.search input{border:0;background:transparent;padding:7px 0;width:210px;max-width:46vw;outline:none}
.colvis{display:flex;flex-wrap:wrap;gap:4px}
.vis-chip{font:600 11px/1 var(--f-mono);letter-spacing:.04em;padding:6px 7px;border-radius:5px;cursor:pointer;border:1px solid transparent;background:var(--c);color:var(--cfg)}
.vis-chip.off{background:transparent;color:var(--muted);border-color:var(--line-strong);text-decoration:line-through}

/* ---------- rundown table ---------- */
.table-wrap{overflow:auto;max-height:78vh;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow)}
table.rd{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.rd th,.rd td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;padding:0;background:var(--surface)}
.rd thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);text-align:left;padding:9px 10px;font-weight:500;vertical-align:bottom}
.rd .c-num{position:sticky;left:0;z-index:2;width:62px;min-width:62px;border-left:4px solid var(--k,transparent)}
.rd thead .c-num{z-index:5;border-left-color:var(--surface-2);font:600 12px var(--f-mono);color:var(--muted)}
.rd .c-seg{width:268px;min-width:268px}
@media (min-width:900px){.rd .c-seg{position:sticky;left:62px;z-index:2;box-shadow:1px 0 0 var(--line)} .rd thead .c-seg{z-index:5}}
.rd .c-pgm{width:116px;min-width:116px}
.rd .c-src{width:176px;min-width:176px}
.rd .c-note{width:190px;min-width:190px}
.rd thead th.c-src{border-top:4px solid var(--c);padding-top:7px}
.th-k{display:block;font:600 12px/1 var(--f-mono);color:var(--tally);letter-spacing:.08em}
.th-n{display:block;font-weight:600;font-size:13px;margin-top:6px;line-height:1.2}
.th-s{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.25}
.th-c{font-size:11.5px;color:var(--muted);font-weight:400}
.c-num .num{font:600 18px/1 var(--f-mono);padding:9px 0 0 9px;font-variant-numeric:tabular-nums}
.c-num .time{font:500 11px/1 var(--f-mono);color:var(--muted);padding:5px 0 0 9px}
.rtools{display:grid;grid-template-columns:repeat(2,26px);gap:2px;padding:8px 4px 8px 4px;opacity:.55}
tr:hover .rtools,tr:focus-within .rtools{opacity:1}
.rd textarea,.rd input.cell{display:block;width:100%;border:0;background:transparent;resize:none;padding:8px 10px;line-height:1.4;font-size:13px;min-height:34px;field-sizing:content;border-radius:0}
.rd textarea:focus,.rd input.cell:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface)}
.rd textarea[readonly]:focus{outline:none}
.rd textarea::placeholder,.rd input::placeholder{color:color-mix(in srgb,var(--muted) 55%,transparent)}
.rd textarea.seg{font-weight:600;font-size:14px;padding-bottom:2px}
.rd textarea.cue{font-style:italic;color:var(--muted);font-size:12.5px;padding-top:4px}
.seg-meta{display:flex;gap:6px;padding:4px 10px 2px;align-items:center}
.kind-sel{font:500 11.5px var(--f-body);padding:3px 6px;border-radius:999px;border:1px solid color-mix(in srgb,var(--k) 55%,var(--line));background:color-mix(in srgb,var(--k) 13%,var(--surface));color:var(--ink);max-width:118px}
.seg-meta input{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px;background:var(--surface);min-width:0}
.seg-meta .mc{flex:1 1 auto;width:70px}
.seg-meta .dur{width:56px;flex:none;font-family:var(--f-mono)}
.seg-meta input[readonly]{border-color:transparent;padding-inline:0}
.c-pgm-in{padding:8px}
.pgm-sel{width:100%;font:600 12.5px var(--f-mono);color:var(--tally);background:var(--tally-soft);border:1px solid color-mix(in srgb,var(--tally) 45%,transparent);border-radius:6px;padding:6px 5px}
.pgm-sel:disabled{opacity:1}
.pgm-name{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.25}
.rd td.c-src.is-pgm{background:color-mix(in srgb,var(--tally) 8%,var(--surface));box-shadow:inset 3px 0 0 var(--tally)}
.rd td.c-src.is-pgm textarea{font-weight:500}
.empty-row{color:var(--muted);padding:14px 4px}
.foot-note{color:var(--muted);font-size:12.5px;padding-block:10px 40px}

/* ---------- live ---------- */
.live{display:grid;gap:14px;padding-block:16px 48px}
.live-bar{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center}
.live-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.live-ctl select{max-width:min(360px,70vw)}
.live-clock{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.live-clock b{font:600 17px/1 var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.live-now{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 24px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--k);border-radius:12px;padding:18px 22px;box-shadow:var(--shadow)}
.live-num{font:600 68px/.85 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.live-num .l{display:block;font:600 12px/1 var(--f-mono);letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
.live-num .of{font-size:20px;color:var(--muted);letter-spacing:0}
.live-kind{font-size:13px;color:var(--muted)}
.live-kind b{color:var(--ink);font-weight:600}
.live-seg{font:700 clamp(26px,3.4vw,42px)/1.02 var(--f-display);margin-top:4px;text-wrap:balance}
.live-cue{margin:10px 0 0;padding:10px 14px;border-left:3px solid var(--line-strong);background:var(--surface-2);border-radius:0 8px 8px 0;font:italic 400 15px/1.45 var(--f-body)}
.live-note{display:flex;gap:8px;align-items:flex-start;margin-top:10px;color:var(--warn);font-weight:500}
.live-note svg{margin-top:2px}
.call-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.call-btn{font:700 18px/1 var(--f-display);letter-spacing:.06em;padding:14px 22px;min-height:52px}
.call-btn.sb{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.call-btn.go{background:var(--tally);color:var(--tally-ink);border-color:var(--tally);flex:1 1 220px}
.call-panel:empty{display:none}
.call-panel{border-radius:12px;padding:16px 20px;text-align:center;display:grid;gap:6px}
.call-panel.standby{background:var(--warn-soft);color:var(--ink);border:2px solid var(--warn)}
.call-panel.count{background:var(--ink);color:var(--bg)}
.call-panel.go{background:var(--tally);color:var(--tally-ink)}
.cp-l{font:600 13px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.cp-big{font:700 clamp(28px,5vw,56px)/1.05 var(--f-display);text-wrap:balance}
.cp-sub{font-size:15px;opacity:.85}
.cp-count{font:700 clamp(90px,18vw,200px)/.9 var(--f-mono);font-variant-numeric:tabular-nums}
.cp-in{font-size:.35em;vertical-align:middle;opacity:.8}
.call-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 8px;align-items:center;padding:2px 10px 8px}
.call-l{font:600 9.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.rd .call-in{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.words-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
details.adv summary{cursor:pointer;list-style:revert}
.tally-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
.tally{display:flex;align-items:center;gap:14px;border-radius:10px;padding:12px 16px;min-width:0}
.tally .tl{font:600 12px/1 var(--f-mono);letter-spacing:.14em;padding:6px 8px;border-radius:5px;flex:none}
.tally .tv{font:700 22px/1.1 var(--f-display);letter-spacing:.03em;min-width:0}
.tally.on{background:var(--tally);color:var(--tally-ink)}
.tally.on .tl{background:color-mix(in srgb,#000 22%,var(--tally))}
.tally.pvw{background:var(--preview-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--preview) 50%,transparent)}
.tally.pvw .tl{background:var(--preview);color:#fff}
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.lcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:12px 13px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lcard.on{outline:3px solid var(--tally);outline-offset:-1px;background:color-mix(in srgb,var(--tally) 6%,var(--surface))}
.lcard.pvw{outline:2px dashed var(--preview);outline-offset:-1px}
.lc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lc-n{font-weight:600;font-size:13.5px}
.lc-h .badge{margin-left:auto}
.lc-crew{font-size:11.5px;color:var(--muted);margin-top:-4px}
.lcard .now{font-size:16px;font-weight:500;line-height:1.35;white-space:pre-line;overflow-wrap:anywhere}
.lcard.idle .now{color:var(--muted);font-weight:400;font-size:14px}
.lcard .nxt{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px;margin-top:auto;white-space:pre-line;overflow-wrap:anywhere}
.l{font:600 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.live-next{background:var(--surface);border:1px dashed var(--line-strong);border-radius:10px;padding:12px 16px;font-size:14px}
.live-next b{font-family:var(--f-mono)}
.live-next .nq{font-style:italic;color:var(--muted);font-size:13px;margin-top:4px}
.hint{font-size:12px;color:var(--muted);margin:0}

/* ---------- crew ---------- */
.kru{display:grid;gap:14px;padding-block:6px 48px}
.kru-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sw{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:9px;row-gap:3px;align-items:center;text-align:left;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.sw .code{grid-row:1 / span 2}
.sw-n{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw-c{font:500 11px/1 var(--f-mono);color:var(--muted)}
.sw.sel{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset;background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.kru-card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;box-shadow:var(--shadow)}
.kru-h{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-end;padding:16px 18px;border-bottom:1px solid var(--line)}
.kru-h h2{font:700 30px/1 var(--f-display);margin-top:5px}
.kru-sub{color:var(--muted);font-size:13px;margin-top:6px}

  const b = e.target.closest('[data-act]'); if (!b || !S.ev) return; const act = b.dataset.act;
  if (act === 'export-json') { offerFile(slug(S.ev.name) + '.json', JSON.stringify({ format: 'cue-sheet-multimedia', version: 1, event: S.ev }, null, 2)); return; }
  if (!S.canWrite) return;
  if (S.gas && /^(link|rot)-(crew|editor)$/.test(act)) { shareAction(act, b); return; }
  const srcs = S.ev.sources;
  if (act === 'src-add') { pushUndo(); const used = new Set(srcs.map(s => s.color)); const color = NEW_COLORS.find(c => !used.has(c)) || NEW_COLORS[srcs.length % NEW_COLORS.length]; const s = { id: 's' + rid(5), code: 'CAM' + (srcs.length + 1), name: 'Sumber baru', desc: '', crew: '', color }; srcs.push(s); touch(); renderAll(); const el = $$('[data-k]').find(x => x.dataset.k === 'src:' + s.id + ':name'); if (el) { el.focus(); el.select(); } return; }
  const row = b.closest('[data-sid]'); const i = row ? srcs.findIndex(s => s.id === row.dataset.sid) : -1;
  if (act === 'src-up' && i > 0) { pushUndo(); [srcs[i - 1], srcs[i]] = [srcs[i], srcs[i - 1]]; touch(); renderAll(); return; }
  if (act === 'src-down' && i >= 0 && i < srcs.length - 1) { pushUndo(); [srcs[i + 1], srcs[i]] = [srcs[i], srcs[i + 1]]; touch(); renderAll(); return; }
  if (act === 'src-del' && i >= 0) {
    if (!arm(b, 'sdel:' + srcs[i].id)) return;
    pushUndo(); const id = srcs[i].id; srcs.splice(i, 1);
    S.ev.cues.forEach(c => { delete c.tasks[id]; if (c.pgm === id) c.pgm = ''; });
    touch(); renderAll(); toast('Sumber dipadam. Buat asal ada dalam Rundown.'); return;
  }
  if (act === 'dup-event') { openNewDialog({ name: S.ev.name + ' (salinan)', date: S.ev.date, start: S.ev.start, from: 'all' }); return; }
  if (act === 'del-event') {
    if (!arm(b, 'edel:' + S.curId, 'Tekan lagi untuk padam terus')) return;
    const id = S.curId; const name = S.ev.name;
    clearTimeout(S.saveT); S.dirty = false;
    removeEvent(id).then(() => { S.curId = null; S.ev = null; LS.set('cs.cur', null); onEventsChanged(); toast('Dipadam: ' + name); })
      .catch(err => toast('Tidak dapat padam' + (err && err.message ? ': ' + err.message : '.'), 'warn'));
  }
});
document.addEventListener('change', e => { if (e.target.classList && e.target.classList.contains('importFile')) { importFile(e.target.files && e.target.files[0]); e.target.value = ''; } });

/* dialogs */
$('#nfCancel').addEventListener('click', () => $('#newDlg').close());
$('#copyClose').addEventListener('click', () => $('#copyDlg').close());
$('#newForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#nfName').value.trim(); if (!name) { $('#nfErr').textContent = 'Isi nama majlis dahulu.'; $('#nfName').focus(); return; }
  const from = ($$('input[name="nfFrom"]').find(r => r.checked) || {}).value || 'blank';
  const base = { name, date: $('#nfDate').value, start: $('#nfStart').value };
  let data;
  if (from === 'all' && S.ev) data = Object.assign(clone(S.ev), base, { cues: S.ev.cues.map(c => Object.assign(clone(c), { id: 'c' + rid(7) })) });
  else if (from === 'sources' && S.ev) data = Object.assign({ theme: '', venue: S.ev.venue, mcs: '', director: S.ev.director, notes: '' }, base, { sources: clone(S.ev.sources), cues: [] });
  else data = Object.assign({}, base, { sources: clone(DEFAULT_SOURCES), cues: [] });
  $('#newDlg').close();
  const id = await createEvent(data);
  if (id) { toast('Majlis dicipta: ' + name); if (S.view === 'live') location.hash = '#rundown'; }
});

/* ---------- boot ---------- */
function loadLocal() {
  const raw = LS.get('cs.events', {}); S.events = {};
  if (raw && typeof raw === 'object') Object.keys(raw).forEach(id => { S.events[id] = normEvent(raw[id]); });
  S.loaded = true; setStatus('Pelayar ini sahaja', 'busy'); onEventsChanged();
}
function startDb() {
  setStatus('Menyambung…', 'busy');
  let definitive = false;
  const timer = setTimeout(() => { if (!definitive) { setStatus('Data belum dapat dicapai', 'warn'); if (!S.loaded) { S.loaded = true; renderAll(); } } }, 10000);
  S.db.collection('events').onSnapshot(snap => {
    if (!snap.metadata.fromCache && (!definitive || S.gas)) { definitive = true; clearTimeout(timer); if (!S.dirty && !S.saving && S.canWrite) setStatus('Disimpan', 'ok'); }
    const map = {}; snap.docs.forEach(d => { if (d.exists) map[d.id] = d.data(); });
    /* a snapshot already in flight may predate an event we just created: keep it briefly */
    Object.keys(S.justWrote).forEach(id => { if (map[id] || Date.now() - S.justWrote[id] > 15000) delete S.justWrote[id]; else if (S.events[id]) map[id] = S.events[id]; });
    S.events = map; S.loaded = true; onEventsChanged();
  }, err => {
    clearTimeout(timer); definitive = true; S.loaded = true;
    if (err && (err.code === 'revoked' || err.code === 'permission_denied')) { S.canWrite = false; S.roReason = 'Link ini sudah ditukar. Minta link terkini daripada pemilik.'; setStatus('Akses ditarik', 'warn'); }
    else if (S.gas && definitive && S.ev) { setStatus('Tiada sambungan, cuba lagi…', 'warn'); return; } // keep showing the last data
    else setStatus('Data tidak dapat dicapai', 'warn');
    renderAll();
  });
}
function loadSnapshot() {
  let snap = null;
  try { snap = JSON.parse($('#csSnapshot').textContent); } catch (e) {}
  const raw = snap && snap.events && typeof snap.events === 'object' ? snap.events : {};
  S.events = {}; Object.keys(raw).forEach(id => { S.events[id] = normEvent(raw[id]); });
  S.canWrite = false;
  const at = Number(snap && snap.at) || 0; const d = new Date(at);
  const when = at ? `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
  S.roReason = `Paparan baca sahaja${when ? ' · salinan dikemaskini ' + when : ''}. Log masuk ke Claude untuk lihat versi terkini.`;
  S.loaded = true; setStatus('Salinan baca sahaja', ''); onEventsChanged();
}
async function checkWrite() {
  try {
    const u = await getCap('user'); if (!u) return;
    const can = await u.can('data.write');
    if (can === false) { S.canWrite = false; S.roReason = 'Anda boleh lihat dan muat turun sahaja. Hanya pemilik dan editor boleh ubah cue sheet ini.'; renderAll(); }
  } catch (e) {}
}
/* ---------- own web app: page on GitHub Pages, data in Google Sheet ----------
   window.CS_API (set by tools/build-web.mjs) is the Apps Script URL. The page POSTs
   {fn, args} there WITHOUT cookies, so whatever Google accounts the browser holds never
   matter (that is what broke opening script.google.com links on phones). The key comes from
   the link (#k=…[&e=…]); the server decides what it may do. */
async function webRun(fn, ...args) {
  // A dropped request is retried twice. Safe for every call except "rotate" (each run makes a
  // new key): the server treats a repeated save as the same save, and a repeated delete as done.
  const tries = fn === 'rotate' ? 1 : 3;
  let j = null;
  for (let i = 0; i < tries && !j; i++) {
    if (i) await new Promise(r => setTimeout(r, 400 * i * i));
    try {
      const res = await fetch(window.CS_API, { method: 'POST', credentials: 'omit', cache: 'no-store', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) });
      j = await res.json();
    } catch (e) { j = null; }
  }
  if (!j) throw { code: 'unavailable', message: 'Tiada sambungan ke server' };
  if (!j.ok) throw { code: j.code || 'unavailable', message: j.message || 'Ralat server' };
  return j.result;
}
/** The key from the link. A link opened once is remembered on this device, and the key is
 *  removed from the address bar so a screenshot or a copied address does not leak it. */
function takeLink() {
  if (window.CS_LINK) return window.CS_LINK; // test runner
  const h = location.hash.replace(/^#/, '');
  if (/(^|&)k=/.test(h)) {
    const p = new URLSearchParams(h); const link = { k: p.get('k') || '', e: p.get('e') || '' };
    LS.set('cs.link', link);
    try { history.replaceState(null, '', location.pathname + location.search + '#' + (link.e ? 'kru' : 'rundown')); } catch (e) {}
    return link;
  }
  const s = LS.get('cs.link', null);
  return s && typeof s.k === 'string' && s.k ? s : null;
}
function forgetLink() { try { localStorage.removeItem('cs.link'); } catch (e) {} }
/* Same shape as the claude.ai db (collection().onSnapshot, doc().set/delete). Changes are
   pulled every 5 s (crew: 15 s) while the tab is visible. */
function gasDb(boot, run) {
  const every = boot.role === 'crew' ? 15000 : 5000;
  const cache = {}, ver = {}; let subs = [], seq = 0, timer = 0, busy = false;
  const snap = () => ({ metadata: { fromCache: false }, docs: Object.keys(cache).map(id => ({ id, exists: true, data: () => clone(cache[id]) })) });
  async function poll() {
    clearTimeout(timer);
    if (busy) return; busy = true; const mySeq = seq;
    try {
      const r = await run('list', boot.key, boot.event, Object.assign({}, ver));
      if (mySeq === seq) { // ignore answers that started before our own last write
        let changed = false;
        Object.keys(cache).forEach(id => { if (!r.ids.includes(id)) { delete cache[id]; delete ver[id]; changed = true; } });
        Object.keys(r.changed).forEach(id => { const c = r.changed[id]; if (!(id in ver) || c.version > ver[id]) { cache[id] = c.data; ver[id] = c.version; changed = true; } });
        if (changed || !poll.done || poll.failed) subs.forEach(s => s.ok(snap()));
        poll.done = true; poll.failed = false;
      }
    } catch (e) { poll.failed = true; subs.forEach(s => s.err && s.err(e)); }
    finally { busy = false; timer = setTimeout(function next() { if (document.visibilityState === 'visible') poll(); else timer = setTimeout(next, every); }, mySeq === seq ? every : 300); }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });
  return {
    run, poll,
    forget(id) { delete ver[id]; delete cache[id]; seq++; poll(); },
    collection() { return { onSnapshot(ok, err) { subs.push({ ok, err }); poll(); return () => { subs = subs.filter(s => s.ok !== ok); }; } }; },
    doc(path) {
      const id = path.split('/')[1];
      return {
        async set(data) { seq++; const r = await run('save', boot.key, id, data, ver[id] || 0); ver[id] = r.version; cache[id] = clone(data); seq++; },
        async delete() { seq++; await run('delete', boot.key, id, ver[id] || 0); delete ver[id]; delete cache[id]; seq++; }
      };
    }
  };
}
async function shareAction(act, btn) {
  const [kind, who] = act.split('-');
  if (kind === 'rot' && !arm(btn, act + ':' + S.curId, 'Tekan lagi: link lama akan mati')) return;
  const lbl = btn.innerHTML; btn.disabled = true;
  try {
    if (S.dirty || S.saving) await flush();
    const r = kind === 'rot' ? await S.db.run('rotate', S.gas.key, who, S.curId) : await S.db.run('links', S.gas.key, who === 'crew' ? S.curId : '');
    const link = r[who]; if (!link) throw { message: 'Link tidak tersedia' };
    const msg = who === 'crew'
      ? `Link cue sheet kru · ${S.ev.name}\n(baca sahaja, tak perlu login)\n${link}`
      : `Link EDITOR cue sheet (boleh ubah data, jangan sebar)\n${link}`;
    await copyText(msg);
    if (kind === 'rot') toast((who === 'crew' ? 'Link kru' : 'Link editor') + ' baru disalin. Link lama sudah mati.');
  } catch (e) { toast('Tidak dapat dapatkan link' + (e && e.message ? ': ' + e.message : '.'), 'warn'); }
  finally { btn.disabled = false; btn.innerHTML = lbl; btn.classList.remove('armed'); }
}
function startGas(boot, run) {
  S.mode = 'db'; S.gas = boot; S.db = gasDb(boot, run);
  if (boot.role === 'crew') { S.canWrite = false; S.roReason = 'Paparan kru: baca sahaja. Cue sheet ini dikemaskini sendiri apabila pengarah membuat perubahan.'; }
  startDb();
}
async function startWeb(link) {
  S.canWrite = false;
  if (!link) { S.mode = 'nolink'; S.loaded = true; setStatus('Perlukan link', 'warn'); renderAll(); return; }
  setStatus('Menyambung…', 'busy');
  try {
    const who = await webRun('whoami', link.k, link.e);
    S.canWrite = who.role !== 'crew';
    startGas({ role: who.role, key: link.k, event: who.role === 'crew' ? link.e : '' }, webRun);
  } catch (e) {
    S.loaded = true;
    if (e && e.code === 'permission_denied') { forgetLink(); S.mode = 'nolink'; S.linkBad = true; setStatus('Link tidak sah', 'warn'); }
    else { S.mode = 'offline'; setStatus('Tiada sambungan', 'warn'); }
    renderAll();
  }
}
async function init() {
  const link = window.CS_API ? takeLink() : null;
  readHash(); renderTop();
  if (window.CS_API) { startWeb(link); return; }
  let db = null;
  if (window.claude && typeof window.claude.use === 'function') db = await getCap('db');
  if (db) { S.mode = 'db'; S.db = db; checkWrite(); startDb(); }
  else if (window.claude) { S.mode = 'snapshot'; loadSnapshot(); } // on claude.ai but signed out
  else { S.mode = 'local'; loadLocal(); } // standalone copy opened from disk
}
init();
/* test hook: only the local test runner (tests/run.html) defines __CS_TEST__ */
if (typeof window.__CS_TEST__ === 'function') window.__CS_TEST__({ S, esc, normEvent, cueTimes, slug, stable, crewText, importFile, createEvent, selectEvent, renderAll, touch, flush, pdfRundown, pdfKru, pdfDirector, callInto, setLive });
})();
